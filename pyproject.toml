[project]
name = "clip-index"
version = "0.1.0"
description = "Local read-only classifier for a filmmaker's video clips."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
clip = [
    "torch>=2.2",
    "open-clip-torch>=2.24",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
clip-index = "clip_index.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
